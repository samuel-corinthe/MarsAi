# Plesk > Domains > Apache & nginx Settings > Additional nginx directives
# Proxy frontend API calls to Cloudflare Worker API.

location = /api {
  return 301 /api/;
}

location ^~ /api/ {
  proxy_pass https://mon-api.mars-ai.workers.dev;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;

  proxy_set_header Host mon-api.mars-ai.workers.dev;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
}

location = /MarsAiFestival/api {
  return 301 /MarsAiFestival/api/;
}

location ^~ /MarsAiFestival/api/ {
  rewrite ^/MarsAiFestival(/api/.*)$ $1 break;
  proxy_pass https://mon-api.mars-ai.workers.dev;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;

  proxy_set_header Host mon-api.mars-ai.workers.dev;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
}
