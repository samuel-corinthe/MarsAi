definitions:
  Movies:
    type: object
    required:
      - movieId
      - score
      - adminId
      
    properties: 
      movieId:
        type: integer
      score:
        type: integer
      adminId:
        type: integer
      
      
    
  Contact:
    type: object
    required:
      - name
      - email
      - subject
      - message
    properties:
      name:
        type: string
      email:
        type: string
      subject:
        type: string
      message:
        type: string
      lang:
        type: string
    
  Newsletter:
    type: object
    required:
      - firstName
      - email
      - preferences 
    properties:
      firstName:
        type: string
      email:
        type: string
      preferences:
        type: array
        items:
          type: string
      lang:
        type: string
  Sitephase:
      type: object
      required:
        - movieId
        - selected
        - actorAdminId
        - currentPhase 
        - mode
        - updatedBy
        - actorRole
      properties:
        movieId:
          type: integer
        selected:
          type: boolean
        actorAdminId:
          type: integer
        currentPhase:
          type: integer
        mode:
          type: string
        updatedBy:
          type: integer 
        actorRole:
          type: string 
      
    
     
    
externalDocs:
