        - application/xml
      
      responses:
        '200':
          description: Success
        '403':
          description: Error
        '500':
          description: Error
    patch:
      tags:
        - site-phase
      summary: Edit phase2 selection
      operationId: patchPhase2Selection
      consumes:
        - application/json
        - application/xml
      produces:
        - application/json
        - application/xml
      parameters:
        - in: body
          name: body
          description: 
          required: true
          schema:
            $ref: '#/definitions/Sitephase'
        
      responses:
        '200':
          description: Success
        '401':
          description: Error
        '500':
          description: Error 
  /api/site-phase/phase3-selection:
    get:
      tags:
        - site-phase
      summary: Get phase3 selection 
      operationId: getPhase3Selection
      consumes:
        - application/json
        - application/xml
      produces:
        - application/json
        - application/xml
      
      responses:
        '200':
          description: Success
        '403':
          description: Error
        '500':
          description: Error
    patch:
      tags:
        - site-phase
      summary: Edit phase3 selection
      operationId: patchPhase3Selection
      consumes:
        - application/json
        - application/xml
      produces:
        - application/json
        - application/xml
      parameters:
        - in: body
          name: body
          description: 
          required: true
          schema:
            $ref: '#/definitions/Sitephase'
        
      responses:
        '200':
          description: Success
        '401':
          description: Error
        '500':
          description: Error
  /api/site-phase/phase2-selection/validate:
    post:
      tags:
        - site-phase
      summary: Validate Phase2 Selection
      operationId: postValidatePhase2Selection
      consumes:
        - application/json
        - application/xml
      produces:
        - application/json
        - application/xml
      parameters:
        - in: body
          name: body
          description: 
          required: true
          schema:
            $ref: '#/definitions/Sitephase'
      responses:
        '200':
          description: Success
        '400':
          description: Error
        '500':
          description: Error
  /api/site-phase/phase3-selection/validate:
     post:
      tags:
        - site-phase
